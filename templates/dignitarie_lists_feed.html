<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .dignitarieList.Name }} — Лента</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="phone">
    <main class="feed">
        <video class="feed__video" src="{{ .dignitarieList.VideoSrc }}" poster="{{ .dignitarieList.ImageSrc }}"
               autoplay muted loop playsinline></video>

        <!-- Текст внизу слева: название и короткое описание (2 строки) с «Ещё…» без JavaScript -->
        <input class="feed__toggle" type="checkbox" id="feed-more">
        <div class="feed__info">
            <h1 class="feed__title">{{ .dignitarieList.Name }}</h1>
            <p class="feed__description">{{ .dignitarieList.DescriptionText }}</p>
            <label class="feed__more" for="feed-more"></label>
        </div>

        <!-- Справа: два поля по теме, лайк и «Далее» -->
        <aside class="feed__actions">
            <div class="feed__field">
                <span class="feed__field-label">Начало</span>
                <span class="feed__field-value">{{ .dignitarieList.StartText }}</span>
            </div>
            <div class="feed__field">
                <span class="feed__field-label">Конец</span>
                <span class="feed__field-value">{{ .dignitarieList.EndText }}</span>
            </div>
            <div class="feed__action">
                <span class="feed__action-icon feed__action-icon--like">&#9829;&#xFE0E;</span>
                <span class="feed__action-label">{{ .dignitarieList.LikesCount }}</span>
            </div>
            <a class="feed__action" href="/dignitarie_lists/feed?id={{ .dignitarieList.ID }}&next=true">
                <span class="feed__action-icon">⌄</span>
                <span class="feed__action-label">Далее</span>
            </a>
        </aside>
    </main>
    {{ template "tabbar" "feed" }}
</div>
</body>
</html>
