<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .dignitary.Name }} — Лента сановников</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="phone">
    <main class="feed">
        <video class="feed__video" src="{{ .dignitary.VideoURL }}" poster="{{ .dignitary.ImageURL }}"
               autoplay muted loop playsinline></video>

        <div class="feed__info">
            <div class="feed__author">
                <img class="feed__avatar" src="{{ .dignitary.ImageURL }}" alt="{{ .dignitary.Name }}">
                <span class="feed__office">{{ .dignitary.Office }}</span>
            </div>
            <h1 class="feed__title">{{ .dignitary.Name }}</h1>
            <details class="feed__details">
                <summary class="feed__more"></summary>
                <p class="feed__description">{{ .dignitary.Description }}</p>
            </details>
        </div>

        <aside class="feed__actions">
            <div class="feed__field">
                <span class="feed__field-label">Начало</span>
                <span class="feed__field-value">{{ formatYear .dignitary.OfficeStart }}</span>
            </div>
            <div class="feed__field">
                <span class="feed__field-label">Конец</span>
                <span class="feed__field-value">{{ formatYear .dignitary.OfficeEnd }}</span>
            </div>
            <div class="feed__action">
                <span class="feed__action-icon feed__action-icon--like">&#9829;&#xFE0E;</span>
                <span class="feed__action-label">{{ .dignitary.LikesCount }}</span>
            </div>
            <a class="feed__action" href="/dignitary_feed/{{ .dignitary.ID }}?next=true">
                <span class="feed__action-icon">⌄</span>
                <span class="feed__action-label">Далее</span>
            </a>
        </aside>
    </main>
    {{ template "tabbar" "feed" }}
</div>
</body>
</html>
