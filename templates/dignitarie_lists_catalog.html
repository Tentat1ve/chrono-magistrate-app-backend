<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плитка</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="phone">
    <main class="page">
        <h1 class="page__title">Сановники</h1>

        <!-- Фильтр на сервере: календарь и кнопка «Найти» -->
        <form class="search" action="/dignitarie_lists/catalog" method="GET">
            <input class="field__input search__input" type="date" name="date" value="{{ .date }}" title="Дата пребывания в должности">
            <button class="button button--primary search__button" type="submit">Найти</button>
        </form>

        <div class="tiles">
            {{ range .dignitarieLists }}
            <article class="tile">
                <a class="tile__link" href="/dignitarie_lists/feed?id={{ .ID }}">
                    <img class="tile__image" src="{{ .ImageSrc }}" alt="{{ .Name }}">
                    <div class="tile__body">
                        <h2 class="tile__name">{{ .Name }}</h2>
                    </div>
                </a>
                <div class="tile__footer">
                    <span class="tile__likes">♥ {{ .LikesCount }}</span>
                    <!-- логическое удаление: POST, SQL UPDATE без ORM -->
                    <form action="/dignitarie_lists/delete" method="POST">
                        <input type="hidden" name="id" value="{{ .ID }}">
                        <button class="tile__delete" type="submit" title="Удалить">Удалить</button>
                    </form>
                </div>
            </article>
            {{ else }}
            <p class="tiles__empty">Сановники не найдены</p>
            {{ end }}
        </div>
    </main>
    {{ template "tabbar" "catalog" }}
</div>
</body>
</html>
