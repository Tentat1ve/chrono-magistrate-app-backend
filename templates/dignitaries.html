<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сановники</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="phone">
    <main class="page">
        <h1 class="page__title">Сановники</h1>

        <form class="search" action="/dignitaries" method="GET">
            <input class="field__input search__input" type="number" name="office_year"
                   value="{{ .officeYear }}" placeholder="Год в должности (−63 = 63 до н.э.)">
            <button class="button button--primary search__button" type="submit">Найти</button>
        </form>

        <div class="tiles">
            {{ range .dignitaries }}
            <a class="tile" href="/dignitary_feed/{{ .ID }}">
                <img class="tile__image" src="{{ .ImageURL }}" alt="{{ .Name }}">
                <div class="tile__body">
                    <h2 class="tile__name">{{ .Name }}</h2>
                    <div class="tile__years">{{ formatYear .OfficeStart }} — {{ formatYear .OfficeEnd }}</div>
                    <div class="tile__likes">♥ {{ .LikesCount }}</div>
                </div>
            </a>
            {{ else }}
            <p class="tiles__empty">Сановники не найдены</p>
            {{ end }}
        </div>
    </main>
    {{ template "tabbar" "tiles" }}
</div>
</body>
</html>
