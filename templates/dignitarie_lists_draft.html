<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="phone">
    <main class="page">
        <h1 class="page__title">Новый сановник</h1>

        {{ if .error }}<p class="form-error">{{ .error }}</p>{{ end }}

        {{ if not .draft }}
        <!-- Шаг 1: черновика нет. Форма без multipart — на сервер уходят только имена файлов -->
        <form class="draft-form" action="/dignitarie_lists/draft" method="POST">
            <section class="draft-form__section">
                <h2 class="draft-form__section-title">Фото и видео</h2>
                <label class="field">
                    <span class="field__label">Фото</span>
                    <input class="field__input" type="file" name="image" accept="image/*">
                </label>
                <label class="field">
                    <span class="field__label">Видео</span>
                    <input class="field__input" type="file" name="video" accept="video/*">
                </label>
            </section>

            <section class="draft-form__section">
                <h2 class="draft-form__section-title">Название</h2>
                <label class="field">
                    <span class="field__label">Название</span>
                    <input class="field__input" type="text" name="name" required maxlength="255">
                </label>
            </section>

            <button class="button button--primary" type="submit">Далее</button>
        </form>
        {{ else }}
        <!-- Шаг 2: черновик есть — заполненные поля и публикация -->
        <form class="draft-form" action="/dignitarie_lists/draft/publish" method="POST">
            <section class="draft-form__section">
                <h2 class="draft-form__section-title">Фото и видео</h2>
                <div class="draft-form__media">
                    <div class="draft-form__media-item">
                        <img class="draft-form__preview" src="{{ .draft.ImageSrc }}" alt="{{ .draft.Name }}">
                        <span class="draft-form__caption">Фото</span>
                    </div>
                    <div class="draft-form__media-item">
                        <video class="draft-form__preview" src="{{ .draft.VideoSrc }}" muted autoplay loop playsinline></video>
                        <span class="draft-form__caption">Видео</span>
                    </div>
                </div>
            </section>

            <section class="draft-form__section">
                <h2 class="draft-form__section-title">Описание</h2>
                <label class="field">
                    <span class="field__label">Название</span>
                    <input class="field__input" type="text" value="{{ .draft.Name }}" disabled>
                </label>
                <label class="field">
                    <span class="field__label">Краткое описание</span>
                    <textarea class="field__input field__input--area" name="description" required>{{ .draft.DescriptionText }}</textarea>
                </label>
            </section>

            <section class="draft-form__section">
                <h2 class="draft-form__section-title">Даты пребывания в должности</h2>
                <div class="field-row">
                    <label class="field">
                        <span class="field__label">Дата начала</span>
                        <input class="field__input" type="date" name="start_date" value="{{ .draft.StartInput }}" required>
                    </label>
                    <label class="field">
                        <span class="field__label">Дата окончания</span>
                        <input class="field__input" type="date" name="end_date" value="{{ .draft.EndInput }}" required>
                    </label>
                </div>
            </section>

            <button class="button button--primary" type="submit">Опубликовать</button>
        </form>
        {{ end }}
    </main>
    {{ template "tabbar" "draft" }}
</div>
</body>
</html>
